# =============================================================================
# HSG-DETR V3-CS²GA-N — Cross-Scale Sparse Global Attention
# =============================================================================
# Replaces per-scale SGTokenBlockV2 (V2c) with a single CrossScaleSGA block
# that processes P3/P4/P5 simultaneously via joint cross-scale self-attention.
#
# Key difference from V2c:
#   V2c:    3 × within-scale self-attention (P3 sees P3, P4 sees P4, P5 sees P5)
#   CS²GA:  1 × cross-scale self-attention  (P3/P4/P5 tokens attend jointly)
#
# Token budget: ~580 total at 640×640
#   P3 (stride 8,  80×80=6400 tokens): ratio=0.05 → k=320
#   P4 (stride 16, 40×40=1600 tokens): ratio=0.10 → k=160
#   P5 (stride 32, 20×20=400  tokens): ratio=0.25 → k=100
#
# Head: YOLO Detect (one-to-many) — same as HSG-DET
# =============================================================================
nc: 80
end2end: true

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]          # 0  P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  - [-1, 1, SGDown, [256]]          # 2  P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4  P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6  P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # FPN/PAN — no per-scale SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9   (from P5/8)
  - [[-1, 5], 1, Concat, [1]]                    # 10  P4+P5
  - [-1, 3, C2f, [512, False]]                   # 11  P4-fused
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 3], 1, Concat, [1]]                    # 13  P3+P4
  - [-1, 3, C2f, [256, False]]                   # 14  P3 ← index 14
  - [-1, 1, Conv, [256, 3, 2]]                   # 15
  - [[-1, 11], 1, Concat, [1]]                   # 16
  - [-1, 3, C2f, [512, False]]                   # 17  P4 ← index 17
  - [-1, 1, Conv, [512, 3, 2]]                   # 18
  - [[-1, 8], 1, Concat, [1]]                    # 19
  - [-1, 3, C2f, [1024, False]]                  # 20  P5 ← index 20
  # CS²GA: cross-scale attention on P3/P4/P5
  - [[14, 17, 20], 1, CrossScaleSGA, [256, 0.05, 0.10, 0.25]]  # 21
  # YOLO detection head (accepts list[Tensor] from CS²GA)
  - [-1, 1, Detect, [nc]]                        # 22
