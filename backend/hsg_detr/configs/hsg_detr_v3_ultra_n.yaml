# HSG-DETR V3-Ultra-N — aggressive efficiency ablation
# Pushes V3 close to legacy/V2-N compute:
#   - decoder hd 256 -> 128
#   - channel_se true -> false
#   - Top-M soft-hard -> hard top-k
#   - P3-SGB removed and replaced by Identity
#   - P4/P5 ratios reduced to 0.120/0.240
# Best for latency/edge testing; small-object quality is the main risk.
# Cost target: ~5.9M params, ~10.0 GFLOPs @640
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SGDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SGDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SGDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  # Ultra path: no SE, reduced P4/P5 SGB, P3 SGB replaced by Identity.
  - [-1, 1, SGTokenBlockV2, [1024, 0.240, "topk", false, 0.0001, false, 4, false, 1.0, 768, 1024, 1.0, 0.0, 0.0]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, SGTokenBlockV2, [512, 0.120, "topk", false, 0.0001, false, 4, false, 1.0, 768, 1024, 1.0, 0.0, 0.0]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False]]
  - [[17, 20, 23], 1, RTDETRDecoderV2, [nc, 128, 100, "stability", 0.3, 0.0]]
