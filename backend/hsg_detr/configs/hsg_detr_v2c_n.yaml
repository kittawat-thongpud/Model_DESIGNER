# =============================================================================
# HSG-DETR-N V2c — Channel-Selective Sparse Global Token Block
# =============================================================================
# Core contribution:
#   SGTokenBlock selects salient tokens spatially (L2 saliency → top-k)
#   and performs global self-attention on them. V2c adds a lightweight
#   squeeze-excitation gate on the attention output:
#
#     delta_se = delta × sigmoid(FC2(ReLU(FC1(avg(delta)))))
#     out = x + gamma × delta_se
#
#   This channel-selective gate focuses gradient onto informative channels,
#   allowing gamma to grow beyond the ~0.02 N-scale ceiling observed in V2/V2b.
#
# Paper narrative:
#   "We propose Channel-Selective Sparse Global Attention (CS-SGA): sparse
#   spatial self-attention on salient tokens, followed by a squeeze-excitation
#   gate that selectively amplifies informative channels in the residual path."
#
# Parameters added per SGTokenBlock:
#   se_fc1: C × (C//4)  |  se_fc2: (C//4) × C  |  bias-free
#   P5: 1024×256 + 256×1024 = 524,288  ← still tiny vs Q/K/V (3×1024²)
#   P4:  512×128 + 128×512  = 131,072
#   P3:  256×64  + 64×256   =  32,768
#
# All other hyperparameters identical to V2b for direct comparison.
# =============================================================================
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # SGTokenBlockV2(c2, ratio, mode, debug, gamma_init, channel_se=True, se_reduction=4)
  # channel_se=true enables the V2c path explicitly; plain V2 keeps it disabled.
  - [-1, 1, SGTokenBlockV2, [1024, 0.480, "topk", false, 0.0001, true, 4]]   # 9  P5-SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                               # 10
  - [[-1, 5], 1, Concat, [1]]                                                # 11
  - [-1, 3, C2f, [512, False]]                                               # 12
  - [-1, 1, SGTokenBlockV2, [512, 0.240, "topk", false, 0.0001, true, 4]]    # 13 P4-SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                               # 14
  - [[-1, 3], 1, Concat, [1]]                                                # 15
  - [-1, 3, C2f, [256, False]]                                               # 16  P3
  - [-1, 1, SGTokenBlockV2, [256, 0.120, "topk", false, 0.0001, true, 4]]    # 17 P3-SGB
  - [-1, 1, Conv, [256, 3, 2]]                                               # 18
  - [[-1, 13], 1, Concat, [1]]                                               # 19
  - [-1, 3, C2f, [512, False]]                                               # 20  P4-final
  - [-1, 1, Conv, [512, 3, 2]]                                               # 21
  - [[-1, 9], 1, Concat, [1]]                                                # 22
  - [-1, 3, C2f, [1024, False]]                                              # 23  P5-final
  - [[17, 20, 23], 1, RTDETRDecoderV2, [nc, (256, 512, 1024), 256, 100, 4, 8, 6, 1024, 0.0, nn.ReLU(), -1, 100, 0.5, 1.0, True, "area", 0.3, 0.0]]         # 24
