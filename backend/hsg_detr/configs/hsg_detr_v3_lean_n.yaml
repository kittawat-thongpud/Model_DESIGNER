# HSG-DETR V3-Lean-N — efficiency ablation near V2-N cost
# Reduces the full V3 design for edge/fair-baseline runs:
#   - decoder hd 256 -> 128
#   - channel_se true -> false at all SGB levels
#   - Top-M soft-hard -> hard top-k
#   - SGB ratios P3/P4/P5 0.120/0.240/0.480 -> 0.080/0.160/0.320
# Keeps three-scale SGB and RTDETRDecoderV2 stability query selection.
# Cost target: ~5.9M params, ~10.2 GFLOPs @640
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SGDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SGDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SGDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  # Lean path: hd=128, channel_se=false, lower SGB ratios, hard top-k by default.
  - [-1, 1, SGTokenBlockV2, [1024, 0.320, "topk", false, 0.0001, false, 4, false, 1.0, 768, 1024, 1.0, 0.0, 0.0]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, SGTokenBlockV2, [512, 0.160, "topk", false, 0.0001, false, 4, false, 1.0, 768, 1024, 1.0, 0.0, 0.0]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, SGTokenBlockV2, [256, 0.080, "topk", false, 0.0001, false, 4, false, 1.0, 768, 1024, 1.0, 0.0, 0.0]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False]]
  - [[17, 20, 23], 1, RTDETRDecoderV2, [nc, 128, 100, "stability", 0.3, 0.0]]
