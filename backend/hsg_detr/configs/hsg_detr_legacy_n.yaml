# =============================================================================
# HSG-DETR-N Legacy — Training Baseline
# =============================================================================
# Architecture: V1 SGTokenBlock (parameter-free L2 saliency, no PE, no STE)
#   + 3 bug fixes applied:
#     1. gamma STE clamp_min — forward=max(|γ|, floor), backward=sign(γ)
#        (replaces broken softplus that pinned γ_eff ≡ 0.707 regardless of training)
#     2. Norm weight dtype — .to(dtype=float32) preserves autograd connection
#     3. Alpha resume guard — fresh-training alpha ramp no longer triggers at epoch 2
#   + Higher token ratios (doubled vs original):
#        P3-SGB: 12%  |  P4-SGB: 24%  |  P5-SGB: 48%
#
# Purpose: establish a clean, reproducible COCO baseline before adding
#          architectural complexity. Compare against V3 (hsg_detr_v3_n.yaml).
#
# Decoder: hd=128, nq=100  |  Alpha schedule: 0→0.50 over 15 epochs
# =============================================================================
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  # SGStem: two stride-2 convs fused with a depthwise middle (P1/2 + P2/4 → P2/4)
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  # SGDown: channel-align then stride-2 (preserves saliency cues before downsampling)
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # P5-SGB: 4ρ = 0.480 (48.0% tokens)
  - [-1, 1, SGTokenBlock, [1024, 0.480]]   # 9  P5-SGB

  # FPN P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 10
  - [[-1, 5], 1, Concat, [1]]                            # 11
  - [-1, 3, C2f, [512, False]]                           # 12

  # P4-SGB: 2ρ = 0.240 (24.0% tokens)
  - [-1, 1, SGTokenBlock, [512, 0.240]]    # 13 P4-SGB

  # FPN P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 14
  - [[-1, 3], 1, Concat, [1]]                            # 15
  - [-1, 3, C2f, [256, False]]                           # 16  P3

  # P3-SGB: ρ = 0.120 (12.0% tokens)
  - [-1, 1, SGTokenBlock, [256, 0.120]]    # 17 P3-SGB

  # PAN P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                           # 18
  - [[-1, 13], 1, Concat, [1]]                           # 19
  - [-1, 3, C2f, [512, False]]                           # 20  P4-final

  # PAN P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                           # 21
  - [[-1, 9], 1, Concat, [1]]                            # 22
  - [-1, 3, C2f, [1024, False]]                          # 23  P5-final

  # RT-DETR decoder (auto-detected by trainer)
  - [[17, 20, 23], 1, RTDETRDecoderSGB, [nc, 128, 100]]  # 24  n: hd=128, nq=100
