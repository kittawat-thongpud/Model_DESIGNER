# =============================================================================
# HSG-DETR v3-N — 30 epoch architecture ablation config
# =============================================================================
# Use this before any 150-epoch run.  v3 changes the sparse block structure, so
# the first question is whether it is stable and competitive by epoch 30.
# =============================================================================

model_id: arch:hsg_detr_v3
model_name: HSG-DETR N v3
model_scale: n
task: detect
dataset_name: coco

imgsz: 640
batch: 64
workers: 8
cache: disk
epochs: 30
patience: 12
seed: 42
deterministic: false
amp: true
ema: true
pin_memory: true

optimizer: AdamW
lr0: 0.00015
lrf: 0.01
momentum: 0.937
weight_decay: 0.02
warmup_epochs: 4.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05
cos_lr: true

# Prefer transferring from the best v2/N-scale checkpoint when available.
# Random-init v3 scorer/aggregator params are expected and handled by optimizer groups.
pretrained: 4e948007202f
use_yolo_pretrained: false
freeze: 0
resume: false

box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0
nbs: 64
iou: 0.7
max_det: 300
agnostic_nms: false
rect: false
single_cls: false

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.10
copy_paste: 0.0
erasing: 0.4
crop_fraction: 1.0
close_mosaic: 10

save_period: -1
val: true
plots: true
overlap_mask: true
mask_ratio: 4
kobj: 1.0
