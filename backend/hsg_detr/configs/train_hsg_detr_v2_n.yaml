# =============================================================================
# HSG-DETR-N V2 — COCO-2017 training config
# =============================================================================
# Purpose: validate the V2 AMP-safe sparse block + decoder changes while
# keeping the same token budgets as the legacy HSG-DETR baseline.
#
# Architecture: SGTokenBlockV2 + RTDETRDecoderV2.
#   - parameter-free L2 saliency, no learnable saliency head
#   - AMP-safe norm/projection dtype handling
#   - Look-Forward-Twice decoder refinement
#   - uncertainty-minimal query selection
#
# Weight transfer: V1 N best checkpoint (mAP50=0.503, 150ep, amp=False).
#   resume=false → fresh optimizer + fresh scheduler.
# =============================================================================

model_id: arch:hsg_detr_v2
model_name: HSG-DETR V2 N
model_scale: n
task: detect
dataset_name: coco

# ── Core ──────────────────────────────────────────────────────────────────────
imgsz: 640
batch: 64
workers: 8
cache: disk
epochs: 150
patience: 30
seed: 42
deterministic: false
amp: true
ema: true
pin_memory: true

# ── Optimizer ─────────────────────────────────────────────────────────────────
# lr0=1.5e-4 plus trainer-side grad clip max_norm=0.1 for RTDETRDecoderV2.
# Cosine decay to lr0 * lrf = 2e-6 at epoch 150.
# warmup_epochs=2: shorter warmup since all weights come from a converged checkpoint.
optimizer: AdamW
lr0: 0.00015
lrf: 0.01
momentum: 0.937
weight_decay: 0.02
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05
cos_lr: true

# ── Weights ───────────────────────────────────────────────────────────────────
# Transfer backbone + neck + decoder from best V1 N checkpoint (150-epoch COCO).
# saliency_head keys (if any) are silently dropped by _load_from_state_dict.
pretrained: 4e948007202f
use_yolo_pretrained: false
freeze: 0
resume: false

# ── Loss weights (RT-DETR) ────────────────────────────────────────────────────
box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0
nbs: 64
iou: 0.7
max_det: 300
agnostic_nms: false
rect: false
single_cls: false

# ── Augmentation ──────────────────────────────────────────────────────────────
# Mosaic + mixup for COCO multi-object diversity.
# close_mosaic=20: disable mosaic in final 20 epochs for clean bbox regression.
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.10
copy_paste: 0.10
erasing: 0.4
crop_fraction: 1.0
close_mosaic: 20

# ── Misc ──────────────────────────────────────────────────────────────────────
save_period: -1
val: true
plots: true
overlap_mask: true
mask_ratio: 4
kobj: 1.0
