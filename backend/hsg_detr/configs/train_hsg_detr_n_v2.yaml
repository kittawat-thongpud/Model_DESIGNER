# =============================================================================
# HSG-DETR-N v2 — COCO-2017 training config (architecture update run)
# =============================================================================
# Architecture changes from v1:
#   - Learnable saliency head replaces parameter-free L2 selector
#   - 2D sinusoidal positional encoding injected into Q/K
#   - Soft gate creates gradient bridge: loss → saliency_head → backbone
#   - gamma_init 0.05 → 0.10 (but loaded from pretrained, so no effect here)
#   - Token ratios doubled: P3 6%→12%, P4 12%→24%, P5 24%→48%
#
# Weight transfer strategy:
#   pretrained: 4e948007202f (N-scale, mAP50=0.503, 150 epochs, no AMP)
#   resume: false — fresh optimizer + scheduler, only weights transferred
#   saliency_head is new (random init), all other layers inherit from pretrained
#
# Learning rate rationale:
#   lr0=1.5e-4 is conservative for fine-tuning — pretrained backbone/decoder
#   should not be disrupted early. saliency_head gets 2× LR (3e-4) via optimizer
#   group, gamma gets 5× LR (7.5e-4). warmup_epochs=4 gives saliency_head
#   time to produce stable scores before it interacts with backbone gradients.
# =============================================================================

model_id: arch:hsg_detr
model_name: HSG-DETR N v2
model_scale: n
task: detect
dataset_name: coco

# ── Core ──────────────────────────────────────────────────────────────────────
imgsz: 640
batch: 64
workers: 8
cache: disk
epochs: 150
patience: 30
seed: 42
deterministic: false
amp: true
ema: true
pin_memory: true

# ── Optimizer ─────────────────────────────────────────────────────────────────
# Conservative lr0 to protect pretrained backbone while saliency_head ramps up.
# Cosine decay to lr0 * lrf = 1.5e-6 at epoch 150.
optimizer: AdamW
lr0: 0.00015
lrf: 0.01
momentum: 0.937
weight_decay: 0.02
warmup_epochs: 4.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05
cos_lr: true

# ── Weights ───────────────────────────────────────────────────────────────────
# Transfer backbone + neck + decoder from best N checkpoint (150-epoch COCO run).
# saliency_head is absent in that checkpoint → random init (expected / intended).
pretrained: 4e948007202f
use_yolo_pretrained: false
freeze: 0
resume: false

# ── Loss weights (RT-DETR) ────────────────────────────────────────────────────
box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0
nbs: 64
iou: 0.7
max_det: 300
agnostic_nms: false
rect: false
single_cls: false

# ── Augmentation ──────────────────────────────────────────────────────────────
# Mosaic=1.0 and mixup=0.10 are important for COCO multi-object diversity.
# copy_paste=0.10 helps small-object coverage (P3 tokens now 12% so more benefit).
# close_mosaic=20: disable mosaic in final 20 epochs for clean bbox regression.
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.10
copy_paste: 0.10
erasing: 0.4
crop_fraction: 1.0
close_mosaic: 20

# ── Misc ──────────────────────────────────────────────────────────────────────
save_period: -1
val: true
plots: true
overlap_mask: true
mask_ratio: 4
kobj: 1.0
