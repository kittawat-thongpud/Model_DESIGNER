# HSG-DETR V3-N — full selective detector
# Keeps the complete V3 idea:
#   - decoder hd=256, nq=100
#   - channel_se=true on P3/P4/P5 sparse deltas
#   - Top-M soft-hard training path enabled
#   - approximate DAM metrics enabled by the V3 plugin
# Cost target: ~10.5M params, ~18.7-19.5 GFLOPs @640
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SGDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SGDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SGDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, SGTokenBlockV2, [1024, 0.480, "topk", false, 0.0001, true, 4, true, 1.5, 768, 1024, 1.0, 0.10, 0.0]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, SGTokenBlockV2, [512, 0.240, "topk", false, 0.0001, true, 4, true, 1.5, 768, 1024, 1.0, 0.10, 0.0]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, SGTokenBlockV2, [256, 0.120, "topk", false, 0.0001, true, 4, true, 1.5, 768, 1024, 1.0, 0.10, 0.0]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False]]
  - [[17, 20, 23], 1, RTDETRDecoderV2, [nc, 256, 100, "stability", 0.3, 0.0]]
