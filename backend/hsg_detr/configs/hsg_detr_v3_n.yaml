# =============================================================================
# HSG-DETR v3-N — Reference-Guided Sparse Aggregation
# =============================================================================
# v3 replaces selected-token all-pairs self-attention with local sparse
# aggregation around learned reference tokens:
#   scorer + L2 prior -> top-k references -> local window attention -> gamma fuse
#
# Token budgets are intentionally lower than v2 because complexity is tied to
# window area and we want a clean first ablation:
#   P3: 10% refs, 3x3 window   | small-object dense scale
#   P4: 8% refs,  3x3 window   | mid-scale
#   P5: 6% refs,  5x5 window   | coarse/global context
# Decoder: hd=128, nq=100  |  Alpha schedule: 0->0.50 over 15 epochs
# =============================================================================
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # P5: fewer coarse references, larger local window
  - [-1, 1, ReferenceGuidedSparseBlock, [1024, 0.060, 5]]   # 9

  # FPN P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 10
  - [[-1, 5], 1, Concat, [1]]                               # 11
  - [-1, 3, C2f, [512, False]]                              # 12

  # P4
  - [-1, 1, ReferenceGuidedSparseBlock, [512, 0.080, 3]]    # 13

  # FPN P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 14
  - [[-1, 3], 1, Concat, [1]]                               # 15
  - [-1, 3, C2f, [256, False]]                              # 16

  # P3
  - [-1, 1, ReferenceGuidedSparseBlock, [256, 0.100, 3]]    # 17

  # PAN P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                              # 18
  - [[-1, 13], 1, Concat, [1]]                              # 19
  - [-1, 3, C2f, [512, False]]                              # 20

  # PAN P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                              # 21
  - [[-1, 9], 1, Concat, [1]]                               # 22
  - [-1, 3, C2f, [1024, False]]                             # 23

  - [[17, 20, 23], 1, RTDETRDecoderSGB, [nc, 128, 100]]     # 24
