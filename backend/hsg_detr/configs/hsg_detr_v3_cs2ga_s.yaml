# =============================================================================
# HSG-DETR V3-CS²GA-S — Cross-Scale Sparse Global Attention
# =============================================================================
# Replaces per-scale SGTokenBlockV2 (V2c) with a single CrossScaleSGA block
# that processes P3/P4/P5 simultaneously via joint cross-scale self-attention.
#
# Token budget uses the same ratio/cap contract as N at 640×640:
#   P3 ratio=0.05, max_k3=384
#   P4 ratio=0.10, max_k4=192
#   P5 ratio=0.25, max_k5=128
#
# Head: YOLO Detect (end2end=True)
# =============================================================================
nc: 80
end2end: true

scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, SGStem, [128]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SGDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SGDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SGDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False]]
  - [[14, 17, 20], 1, CrossScaleSGA, [256, 0.058, 0.128, 0.250, 0.1]]
  - [-1, 1, Detect, [nc]]
