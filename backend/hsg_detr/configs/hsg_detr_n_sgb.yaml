nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  - [-1, 1, SparseGlobalTokenBlock, [1024, 384, 0.25]]   # 9  P5-SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 10
  - [[-1, 5], 1, Concat, [1]]                            # 11
  - [-1, 3, C2f, [512, False]]                          # 12
  - [-1, 1, SparseGlobalTokenBlock, [512, 192, 0.12]]   # 13 P4-SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 14
  - [[-1, 3], 1, Concat, [1]]                            # 15
  - [-1, 3, C2f, [256, False]]                          # 16  P3
  - [-1, 1, SparseGlobalTokenBlock, [256, 128, 0.05]]   # 17 P3-SGB-light
  - [-1, 1, Conv, [256, 3, 2]]                          # 18
  - [[-1, 13], 1, Concat, [1]]                          # 19
  - [-1, 3, C2f, [512, False]]                        # 20  P4-final
  - [-1, 1, Conv, [512, 3, 2]]                          # 21
  - [[-1, 9], 1, Concat, [1]]                           # 22
  - [-1, 3, C2f, [1024, False]]                        # 23  P5-final

  # Phase 3c: SGB-guided decoder (alpha=0.5)
  - [[17, 20, 23], 1, RTDETRDecoderSGB, [nc, 128, 100]]           # 24
