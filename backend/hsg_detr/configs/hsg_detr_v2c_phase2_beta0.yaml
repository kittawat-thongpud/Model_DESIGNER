# =============================================================================
# HSG-DETR-N V2c Phase 2: SGB Role Separation - Beta=0 (Separated Roles)
# =============================================================================
# Phase 2 experiment: Test separated SGB roles
# beta_s: 0.0 = No SGB saliency in query selection
# Expected: Pure localization-aware query selection, SGB only for feature enhancement
# =============================================================================

nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # SGTokenBlockV2(c2, ratio, mode, debug, gamma_init, channel_se=True, se_reduction=4)
  # channel_se=true enables the V2c path explicitly; plain V2 keeps it disabled.
  - [-1, 1, SGTokenBlockV2, [1024, 0.480, "topk", false, 0.0001, true, 4]]   # 9  P5-SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                               # 10
  - [[-1, 5], 1, Concat, [1]]                                                # 11
  - [-1, 3, C2f, [512, False]]                                               # 12
  - [-1, 1, SGTokenBlockV2, [512, 0.240, "topk", false, 0.0001, true, 4]]    # 13 P4-SGB
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                               # 14
  - [[-1, 3], 1, Concat, [1]]                                                # 15
  - [-1, 3, C2f, [256, False]]                                               # 16  P3
  - [-1, 1, SGTokenBlockV2, [256, 0.120, "topk", false, 0.0001, true, 4]]    # 17 P3-SGB
  - [-1, 1, Conv, [256, 3, 2]]                                               # 18
  - [[-1, 13], 1, Concat, [1]]                                               # 19
  - [-1, 3, C2f, [512, False]]                                               # 20  P4-final
  - [-1, 1, Conv, [512, 3, 2]]                                               # 21
  - [[-1, 9], 1, Concat, [1]]                                                # 22
  - [-1, 3, C2f, [1024, False]]                                              # 23  P5-final
  - [[17, 20, 23], 1, RTDETRDecoderV2, [nc, [256, 512, 1024], 256, 100, 4, 8, 6, 1024, 0.0, nn.ReLU(), -1, 100, 0.5, 1.0, True, "area", 0.3, 0.0]] # 24
