# =============================================================================
# HSG-DETR-N V2 — AMP-safe redesign with T1-A LFT and T2-A uncertainty-minimal
# =============================================================================
# Changes from Legacy (hsg_detr_n.yaml):
#   SGTokenBlockV2  — GroupNorm/Conv inputs cast via .to(dtype=weight.dtype)
#                     LayerNorm island uses explicit .float() on input+weights
#                     T2-B: logs last_score_std (σ) for token-budget analysis
#   RTDETRDecoderV2 — T1-A Look-Forward-Twice: no .detach() on refer_bbox
#                     T2-A Uncertainty-minimal query selection:
#                       U(X) = |cls_norm(X) - loc_norm(X)|
#                       combined = cls_norm - alpha * uncertainty_norm
#   !! Requires clip_grad_norm ≤ 0.1 in training config (LFT gradient chain) !!
#
# Token ratios: same as Legacy (P3=12%, P4=24%, P5=48%)
# Decoder: hd=128, nq=100
# =============================================================================
nc: 80

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # P5-SGB: 48% tokens
  - [-1, 1, SGTokenBlockV2, [1024, 0.480]]   # 9  P5-SGB

  # FPN P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 10
  - [[-1, 5], 1, Concat, [1]]                            # 11
  - [-1, 3, C2f, [512, False]]                           # 12

  # P4-SGB: 24% tokens
  - [-1, 1, SGTokenBlockV2, [512, 0.240]]    # 13 P4-SGB

  # FPN P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 14
  - [[-1, 3], 1, Concat, [1]]                            # 15
  - [-1, 3, C2f, [256, False]]                           # 16  P3

  # P3-SGB: 12% tokens
  - [-1, 1, SGTokenBlockV2, [256, 0.120]]    # 17 P3-SGB

  # PAN P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                           # 18
  - [[-1, 13], 1, Concat, [1]]                           # 19
  - [-1, 3, C2f, [512, False]]                           # 20  P4-final

  # PAN P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                           # 21
  - [[-1, 9], 1, Concat, [1]]                            # 22
  - [-1, 3, C2f, [1024, False]]                          # 23  P5-final

  # RT-DETR V2 decoder with LFT + uncertainty-minimal query selection
  - [[17, 20, 23], 1, RTDETRDecoderV2, [nc, 128, 100]]  # 24  n: hd=128, nq=100
