# HSG-DETR-M — SGB-guided RT-DETR DecoderSGB (MEDIUM scale)
nc: 80

scales:
  m: [0.67, 0.75, 768]

backbone:
  # Phase 2: SGStem replaces first two Conv(stride=2) layers (P1/2 + P2/4 → P2/4)
  - [-1, 1, SGStem, [128]]          # 0-P2/4
  - [-1, 3, C2f, [128, True]]       # 1
  # Phase 2: SGDown replaces Conv(stride=2) with clue-preserving downsampling
  - [-1, 1, SGDown, [256]]          # 2-P3/8
  - [-1, 6, C2f, [256, True]]       # 3
  - [-1, 1, SGDown, [512]]          # 4-P4/16
  - [-1, 6, C2f, [512, True]]       # 5
  - [-1, 1, SGDown, [1024]]         # 6-P5/32
  - [-1, 3, C2f, [1024, True]]      # 7
  - [-1, 1, SPPF, [1024, 5]]        # 8

head:
  # P5 sparse-token SGB (scale-aware: ~25% at P5)
  - [-1, 1, SGTokenBlock, [1024, 0.25]]   # 9  P5-SGB

  # FPN P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 10
  - [[-1, 5], 1, Concat, [1]]                            # 11
  - [-1, 3, C2f, [512, False]]                          # 12

  # P4 sparse-token SGB (scale-aware: ~12% at P4)
  - [-1, 1, SGTokenBlock, [512, 0.12]]   # 13 P4-SGB

  # FPN P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 14
  - [[-1, 3], 1, Concat, [1]]                            # 15
  - [-1, 3, C2f, [256, False]]                          # 16  P3

  # P3 light SGB (scale-aware: ~5% at P3)
  - [-1, 1, SGTokenBlock, [256, 0.05]]   # 17 P3-SGB-light

  # PAN P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                          # 18
  - [[-1, 13], 1, Concat, [1]]                          # 19
  - [-1, 3, C2f, [512, False]]                        # 20  P4-final

  # PAN P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                          # 21
  - [[-1, 9], 1, Concat, [1]]                           # 22
  - [-1, 3, C2f, [1024, False]]                        # 23  P5-final

  # RT-DETR decoder (auto-detected by trainer)
  - [[17, 20, 23], 1, RTDETRDecoderSGB, [nc, 256, 200]]     # 24  # m scale: hd=256, nq=200

