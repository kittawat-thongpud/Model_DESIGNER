# =============================================================================
# HSG-DETR V3-CS²GA-L — Cross-Scale Sparse Global Attention
# =============================================================================
# Large scale increases backbone/neck capacity while keeping CS²GA token caps
# bounded for stable memory and latency.
# =============================================================================
nc: 80
end2end: true

scales:
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, SGStem, [128]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SGDown, [256]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SGDown, [512]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SGDown, [1024]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False]]
  - [[14, 17, 20], 1, CrossScaleSGA, [256, 0.05, 0.10, 0.25]]
  - [-1, 1, Detect, [nc]]
