  # HSG-DET V2 Nano — Hybrid Sparse-Global Detector
  #
  # Architecture:
  #   - Backbone : YOLOv8-n C2f/CSP (transfer weight from COCO pretrained 1:1)
  #   - Neck     : FPN/PAN + SparseGlobalTokenBlock at P3/P4/P5
  #                ratio-based token selection (scales automatically with imgsz)
  #                sigmoid gate → 50% contribution from epoch 1
  #   - Head     : Decoupled anchor-free Detect (standard YOLOv8)
  #
  # Params: ~3.5M  |  imgsz=640: P5=100 P4=192 P3=320 tokens

  # ─── Global ──────────────────────────────────────────────────────────────────
  nc: 80

  scales:
    n: [0.33, 0.25, 1024]

  # ─── Backbone ────────────────────────────────────────────────────────────────
  backbone:
    - [-1, 1, Conv,  [64, 3, 2]]   # 0 — stride 2
    - [-1, 1, Conv,  [128, 3, 2]]  # 1 — stride 2
    - [-1, 3, C2f,   [128, True]]  # 2
    - [-1, 1, Conv,  [256, 3, 2]]  # 3 — P3/8
    - [-1, 6, C2f,   [256, True]]  # 4
    - [-1, 1, Conv,  [512, 3, 2]]  # 5 — P4/16
    - [-1, 6, C2f,   [512, True]]  # 6
    - [-1, 1, Conv,  [1024, 3, 2]] # 7 — P5/32
    - [-1, 3, C2f,   [1024, True]] # 8
    - [-1, 1, SPPF,  [1024, 5]]    # 9

  # ─── Neck + Head ─────────────────────────────────────────────────────────────
  head:
    # FPN top-down
    - [-1, 1, SparseGlobalTokenBlock, [1024, 0.25]] # 10 — P5' (25% tokens)
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
    - [[-1, 6], 1, Concat, [1]]                     # 12
    - [-1, 3, C2f, [512]]                           # 13

    - [-1, 1, SparseGlobalTokenBlock, [512, 0.12]]  # 14 — P4' (12% tokens)
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 15
    - [[-1, 4], 1, Concat, [1]]                     # 16
    - [-1, 3, C2f, [256]]                           # 17
    - [-1, 1, SparseGlobalTokenBlock, [256, 0.05]]  # 18 — P3' (5% tokens)

    # PAN bottom-up
    - [-1, 1, Conv, [256, 3, 2]]                    # 19
    - [[-1, 14], 1, Concat, [1]]                    # 20
    - [-1, 3, C2f, [512]]                           # 21

    - [-1, 1, Conv, [512, 3, 2]]                    # 22
    - [[-1, 10], 1, Concat, [1]]                    # 23
    - [-1, 3, C2f, [1024]]                          # 24

    - [[18, 21, 24], 1, Detect, [nc]]               # 25
