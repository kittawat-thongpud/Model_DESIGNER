# HSG-DET Medium v2 — Hybrid Sparse-Global Detector (P3/P4/P5 SGBG)
#
# v2 change:
#   - Add SparseGlobalBlockGated at P3 branch (in addition to P4/P5)
#   - Keeps YOLOv8-style PAN/FPN topology and Detect head

# ─── Global ──────────────────────────────────────────────────────────────────
nc: 80 # default num classes — overridden by dataset plugin at runtime

scales:
  # [depth, width, max_channels]  — 'm' scale matches YOLOv8-m
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 768]
  x: [1.00, 1.25, 1024]

# ─── Backbone ────────────────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0
  - [-1, 1, Conv, [128, 3, 2]]     # 1
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3 (P3)
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5 (P4)
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7 (P5)
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# ─── Neck + Head ─────────────────────────────────────────────────────────────
head:
  # P5 sparse global
  - [-1, 1, SparseGlobalBlockGated, [1024, 512]]   # 10

  # Top-down to P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12
  - [-1, 3, C2f, [512]]                             # 13

  # P4 sparse global
  - [-1, 1, SparseGlobalBlockGated, [512, 512]]    # 14

  # Top-down to P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 15
  - [[-1, 4], 1, Concat, [1]]                       # 16
  - [-1, 3, C2f, [256]]                             # 17

  # v2: P3 sparse global
  - [-1, 1, SparseGlobalBlockGated, [256, 512]]    # 18

  # Bottom-up PAN to P4
  - [-1, 1, Conv, [256, 3, 2]]                      # 19
  - [[-1, 14], 1, Concat, [1]]                      # 20
  - [-1, 3, C2f, [512]]                             # 21

  # Bottom-up PAN to P5
  - [-1, 1, Conv, [512, 3, 2]]                      # 22
  - [[-1, 10], 1, Concat, [1]]                      # 23
  - [-1, 3, C2f, [1024]]                            # 24

  # Detect on (P3, P4, P5)
  - [[18, 21, 24], 1, Detect, [nc]]                 # 25
