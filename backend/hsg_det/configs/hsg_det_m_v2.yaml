  # HSG-DET V2 Medium — Hybrid Sparse-Global Detector
  #
  # Architecture:
  #   - Backbone : YOLOv8-m C2f/CSP (transfer weight from COCO pretrained 1:1)
  #   - Neck     : FPN/PAN + SparseGlobalTokenBlock at P3/P4/P5
  #                ratio-based token selection (scales automatically with imgsz)
  #                sigmoid gate → 50% contribution from epoch 1
  #   - Head     : Decoupled anchor-free Detect (standard YOLOv8)
  #
  # Params: ~26M  |  imgsz=640: P5=100 P4=192 P3=320 tokens

  # ─── Global ──────────────────────────────────────────────────────────────────
  nc: 80

  scales:
    m: [0.67, 0.75, 768]

  # ─── Backbone ────────────────────────────────────────────────────────────────
  # Standard YOLOv8-m backbone (C2f-based CSP) — unchanged from YOLO design.
  # Stride pyramid: stride-2 → P3(s8) → P4(s16) → P5(s32)
  backbone:
    # [from, repeats, module, args]
    - [-1, 1, Conv, [64, 3, 2]] # 0 — Stem: 3→64, stride 2  → 540×960
    - [-1, 1, Conv, [128, 3, 2]] # 1 — stride 2  → 270×480
    - [-1, 3, C2f, [128, True]] # 2 — Low-level features
    - [-1, 1, Conv, [256, 3, 2]] # 3 — stride 2  → 135×240 (P3)
    - [-1, 6, C2f, [256, True]] # 4 — P3 features
    - [-1, 1, Conv, [512, 3, 2]] # 5 — stride 2  → 68×120  (P4)
    - [-1, 6, C2f, [512, True]] # 6 — P4 features
    - [-1, 1, Conv, [1024, 3, 2]] # 7 — stride 2  → 34×60   (P5)
    - [-1, 3, C2f, [1024, True]] # 8 — P5 features
    - [-1, 1, SPPF, [1024, 5]] # 9 — Context enrichment (multi-kernel pool)

  # ─── Neck ─────────────────────────────────────────────────────────────────────
  # PAN/FPN + SparseGlobalTokenBlock (ratio-based, scales with imgsz, gate=0.1).
  head:
    # ── FPN Top-down ──────────────────────────────────────────────────────────

    # P5' — 25% tokens
    - [-1, 1, SparseGlobalTokenBlock, [1024, 0.25]] # 10

    # Upsample P5' and fuse with P4
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
    - [[-1, 6], 1, Concat, [1]] # 12
    - [-1, 3, C2f, [512]] # 13

    # P4' — 12% tokens
    - [-1, 1, SparseGlobalTokenBlock, [512, 0.12]] # 14

    # Upsample P4' and fuse with P3
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
    - [[-1, 4], 1, Concat, [1]] # 16
    - [-1, 3, C2f, [256]] # 17
    # P3' — 5% tokens (small object focus)
    - [-1, 1, SparseGlobalTokenBlock, [256, 0.05]] # 18

    # ── PAN Bottom-up ─────────────────────────────────────────────────────────

    - [-1, 1, Conv, [256, 3, 2]] # 19
    - [[-1, 14], 1, Concat, [1]] # 20
    - [-1, 3, C2f, [512]] # 21

    - [-1, 1, Conv, [512, 3, 2]] # 22
    - [[-1, 10], 1, Concat, [1]] # 23
    - [-1, 3, C2f, [1024]] # 24

    # ── Decoupled Detection Head ──────────────────────────────────────────────
    - [[18, 21, 24], 1, Detect, [nc]] # 25