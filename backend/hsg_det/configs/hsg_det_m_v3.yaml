# HSG-DET Medium — Hybrid Sparse-Global Detector (RT-DETR Head Version)
# 
# Architecture Update:
#   - Backbone : Standard YOLOv8-m CSP-based
#   - Neck     : PAN/FPN + SparseGlobalBlockGated (HSG-DET logic)
#   - Head     : RT-DETR Transformer Decoder (Query-based, NMS-free)
#
# Key Benefit: 
#   Matches Transformer-based features from SparseGlobalBlock with 
#   a Transformer-based Decoder, eliminating the need for NMS.

# ─── Global ──────────────────────────────────────────────────────────────────
nc: 80 

scales:
    n: [0.33, 0.25, 1024]
    s: [0.33, 0.50, 1024]
    m: [0.67, 0.75, 768]
    l: [1.00, 1.00, 768]
    x: [1.00, 1.25, 1024]


# ─── Backbone ────────────────────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0 — P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1 — P2/4
  - [-1, 3, C2f, [128, True]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3 — P3/8
  - [-1, 6, C2f, [256, True]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5 — P4/16
  - [-1, 6, C2f, [512, True]]   # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7 — P5/32
  - [-1, 3, C2f, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9

# ─── Neck & RT-DETR Head ─────────────────────────────────────────────────────
# We keep SparseGlobalBlockGated to maintain HSG-DET's contextual fusion.
head:
  # ── FPN Top-down ──────────────────────────────────────────────────────────
  
  # P5' — Sparse global at P5 
  - [-1, 1, SparseGlobalBlockGated, [1024, 512]] # 10 

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 
  - [-1, 3, C2f, [512, False]]                   # 13

  # P4' — Sparse global at P4 
  - [-1, 1, SparseGlobalBlockGated, [512, 512]]  # 14 

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                    # 16 
  - [-1, 3, C2f, [256, False]]                   # 17
  
  # P3' — Sparse global at P3 (Small object focus)
  - [-1, 1, SparseGlobalBlockGated, [256, 256]]  # 18 (P3 Output)

  # ── PAN Bottom-up ─────────────────────────────────────────────────────────

  - [-1, 1, Conv, [256, 3, 2]]                   # 19 
  - [[-1, 14], 1, Concat, [1]]                   # 20 
  - [-1, 3, C2f, [512, False]]                   # 21 (P4 Output)

  - [-1, 1, Conv, [512, 3, 2]]                   # 22 
  - [[-1, 10], 1, Concat, [1]]                   # 23 
  - [-1, 3, C2f, [1024, False]]                  # 24 (P5 Output)

  # ── RT-DETR Transformer Decoder Head ──────────────────────────────────────
  # แทนที่ Detect เดิมด้วย RTDETRDecoder
  # Args: [num_classes, hidden_dim, num_queries]
  # hidden_dim: ปกติใช้ 256 สำหรับการคำนวณที่สมดุล
  # num_queries: 300 คือมาตรฐานที่ให้ mAP สูงและประมวลผลเร็ว
  # NOTE: channels [P3, P4, P5] are auto-inserted by parse_model at index 1
  - [[18, 21, 24], 1, RTDETRDecoder, [nc, 256, 300]] # 25