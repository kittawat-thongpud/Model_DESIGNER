
nc: 80  # number of classes

# All three scale variants defined in one file.
# The training pipeline injects the `scale` key before loading.
#   T: Tiny  ~6.1 M params, ~14.3 GFLOPs  (fastest, edge/mobile)
#   B: Base  ~21.8 M params, ~49.7 GFLOPs  (balanced accuracy/speed)
#   L: Large ~57.6 M params, ~156.2 GFLOPs  (highest accuracy)
scales:   # [depth, width, max_channels]
  T: [0.33, 0.25, 1024]
  B: [0.33, 0.50, 1024]
  L: [0.67, 0.75, 768]


# Mamba-YOLO backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SimpleStem, [128, 3]]         # 0-P2/4
  - [-1, 3, VSSBlock, [128]]              # 1
  - [-1, 1, VisionClueMerge, [256]]       # 2-P3/8
  - [-1, 3, VSSBlock, [256]]              # 3
  - [-1, 1, VisionClueMerge, [512]]       # 4-P4/16
  - [-1, 9, VSSBlock, [512]]              # 5
  - [-1, 1, VisionClueMerge, [1024]]      # 6-P5/32
  - [-1, 3, VSSBlock, [1024]]             # 7
  - [-1, 1, SPPF, [1024, 5]]              # 8

# Mamba-YOLO PAFPN head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]             # cat backbone P4
  - [-1, 3, XSSBlock, [512]]              # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]             # cat backbone P3
  - [-1, 3, XSSBlock, [256]]              # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]            # cat head P4
  - [-1, 3, XSSBlock, [512]]              # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]             # cat head P5
  - [-1, 3, XSSBlock, [1024]]             # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]]       # Detect(P3, P4, P5)
